[project]
name = "muse-backend"
version = "0.1.0"
description = "FastAPI and LangGraph backend for the Muse learning platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "langgraph==0.6.6",
  "pydantic-settings==2.10.1",
  "supabase==2.18.1",
  "uvicorn[standard]==0.35.0",
]

[project.scripts]
app = "app.main:app"

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
