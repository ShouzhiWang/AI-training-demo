<!doctype html>
<html lang="en">
  <body style="font-family: Arial, sans-serif; color: #1d2b23; line-height: 1.6;">
    <h2>Your Muse sign-in code</h2>
    <p>Enter this eight-digit one-time code in Muse:</p>
    <p style="font-size: 28px; font-weight: 700; letter-spacing: 0.18em;">
      {{ .Token }}
    </p>
    <p>This code expires in one hour and can only be used once.</p>
    <p>If you did not request this code, you can ignore this message.</p>
  </body>
</html>
