<!doctype html>
<html lang="en">
  <body style="font-family: Arial, sans-serif; color: #1d2b23; line-height: 1.6;">
    <h2>Reset your Muse password</h2>
    <p>Use the secure link below to choose a new password.</p>
    <p>
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/reset-password">
        Reset password
      </a>
    </p>
    <p>If you did not request a reset, you can ignore this message.</p>
  </body>
</html>
